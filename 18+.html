<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gerbang Usia 18+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: satu blok teks dan dua tombol, di tengah layar. */
:root {
  --bg: #ffffff;
  --fg: #14171c;
  --muted: #5b6573;
  --line: #d3d8df;
  --accent: #14171c;
  --accent-fg: #ffffff;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114;
    --fg: #f1f3f5;
    --muted: #9aa3b0;
    --line: #2d333b;
    --accent: #f1f3f5;
    --accent-fg: #0f1114;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1114;
  --fg: #f1f3f5;
  --muted: #9aa3b0;
  --line: #2d333b;
  --accent: #f1f3f5;
  --accent-fg: #0f1114;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { width: 100%; max-width: 380px; text-align: center; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
.actions { display: grid; gap: 10px; margin-top: 28px; }
button, .btn {
  display: block;
  font: inherit;
  font-weight: 600;
  min-height: 48px;
  padding: 12px 18px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
}
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button:focus-visible, .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.reset {
  margin-top: 24px; min-height: 0; padding: 4px; border: 0; display: inline-block;
  font-weight: 400; font-size: 13px; color: var(--muted); text-decoration: underline;
}
</style>

<main id="box"></main>

<script>
(function () {
  // Ganti dengan alamat tujuan ketika pengunjung menekan "Ya".
  var TARGET_URL = "https://cdnvidoyvlc.vercel.app/vid.html?unlock=vid_1784636856408";

  var box = document.getElementById("box");
  var KEY = "gerbang18";
  function read() { try { return sessionStorage.getItem(KEY); } catch (e) { return null; } }
  function write(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch (e) {} }

  function render(s) {
    if (s === "no") {
      box.innerHTML = '<h1>Akses ditolak</h1><p>Situs ini hanya untuk usia 18 tahun ke atas.</p>' +
        '<button class="reset" id="reset">Atur ulang contoh</button>';
      document.getElementById("reset").onclick = function () { write(null); render(); };
      return;
    }
    box.innerHTML = '<h1>Apakah usia Anda 18 tahun atau lebih?</h1>' +
      '<p>Situs ini hanya untuk pengunjung dewasa.</p>' +
      '<div class="actions">' +
      '<a class="btn primary" id="yes" href="' + TARGET_URL + '" target="_blank" rel="noopener">Ya, saya 18+</a>' +
      '<button id="no">Tidak</button></div>';
    document.getElementById("no").onclick = function () { write("no"); render("no"); };
  }
  render(read());
})();
</script>

</body></html>
